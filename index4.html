<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link rel="stylesheet" href="pedidos.css">
</head>

<body>

    <div class="telefono-app">

        <header class="producto-header">

            <a href="restaurante.html">
                Regresar
            </a>

        </header>


        <div class="imagen-producto">

            <img src="imagenes/pizza.jpg" alt="Pizza">

        </div>


        <main class="detalle-producto">

            <h1>Combo Pizza Clásica</h1>

            <p class="precio">
                Q39.00
            </p>

            <p class="descripcion">
                Pizza preparada con queso, pepperoni y
                una bebida fría.
            </p>


            <hr>


            <section>

                <h2>Complementos adicionales</h2>

                <p class="seleccion">
                    Puedes seleccionar los complementos que quieras.
                </p>


                <label class="opcion">

                    <span>
                        Papas fritas
                    </span>

                    <strong>
                        + Q10.00
                    </strong>

                    <input type="checkbox">

                </label>


                <label class="opcion">

                    <span>
                        Pizza adicional
                    </span>

                    <strong>
                        + Q20.00
                    </strong>

                    <input type="checkbox">

                </label>


                <label class="opcion">

                    <span>
                        Coca Cola
                    </span>

                    <strong>
                        + Q12.00
                    </strong>

                    <input type="checkbox">

                </label>

            </section>


            <section class="cantidad">

                <h2>Cantidad</h2>

                <div class="contador">
                    1
                </div>

            </section>


            <div class="total-producto">

                <span>
                    Total
                </span>

                <strong>
                    Q39.00
                </strong>

            </div>


            <a href="#" class="agregar">
                Agregar al pedido
            </a>

        </main>


        <nav class="menu-inferior">

            <a href="inicio.html">
                Inicio
            </a>

            <a href="#">
                Pedidos
            </a>

            <a href="#">
                Perfil
            </a>

        </nav>

    </div>

</body>
</html>
