<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>
    <link rel="stylesheet" href="pedidos.css">
</head>

<body class="acceso">

    <div class="telefono">

        <div class="imagen-acceso">
            <img src="imagenes/portada.jpg.png" alt="Comida">
        </div>

        <div class="contenido-acceso">

            <h1>PedidosYa</h1>

            <h2>Inicia sesión</h2>

            <button class="boton-google">
                Continuar con Google
            </button>

            <button class="boton-facebook">
                Continuar con Facebook
            </button>

            <p class="o">o</p>

            <input type="email" placeholder="Correo electrónico">

            <input type="password" placeholder="Contraseña">

            <a href="#" class="olvidaste">
                ¿Olvidaste tu contraseña?
            </a>

            <a href="inicio.html" class="boton-entrar">
                Iniciar sesión
            </a>

            <p class="crear">
                ¿No tienes una cuenta?
                <a href="#">Crear cuenta</a>
            </p>

            <p class="terminos">
                Al continuar aceptas nuestros términos y condiciones
                y política de privacidad.
            </p>

        </div>

    </div>

</body>
</html>
